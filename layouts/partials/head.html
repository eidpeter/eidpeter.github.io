<style>
	nav a {
		margin-right: 6px;
	}

	nav a#dark-mode-toggle {
		margin-right: 0px;
	}
</style>
<header>
	<div class="main">
		<a href="{{ absURL "/" }}">{{ .Site.Title }}</a>
	</div>
	<nav>
		{{ range .Site.Menus.main }}
		<a href="{{ .URL }}">{{ .Name }}</a>
		{{ end }}
		{{ if eq .Site.Params.mode "toggle" -}}
        <a id="dark-mode-toggle" onclick="toggleTheme()" href=""></a>
		<script src="{{ absURL "js/themetoggle.js" }}"></script>
		{{ end }}
	</nav>
</header>
